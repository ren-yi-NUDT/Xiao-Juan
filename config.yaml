# ==================== 灵山景区数字人「小娟」· 语音前端配置 ====================
# 相对路径按【本文件所在目录（项目根）】解析，绝对路径原样使用。

# ---------- 唤醒（KWS） ----------
wake_word: "小娟小娟"          # 唤醒词
kws_model_path: "models/speech_charctc_kws_phone-xiaoyun"
kws_device: "auto"             # auto | cpu | cuda

# ---------- ASR ----------
asr_model_path: "models/faster-whisper-large-v3"
asr_device: "auto"             # auto | cpu | cuda
mic_device_name: ""            # 空 = 系统默认输入设备；也可填设备名关键字

# ---------- TTS（MeloTTS，本机扬声器播放） ----------
tts_config_path: "models/melo/ZH/config.json"
tts_ckpt_path: "models/melo/ZH/checkpoint.pth"
tts_device: "auto"             # auto | cpu | cuda
tts_speed: 1.0

# ---------- 问答后端（rag_backend，前后端分离） ----------
# 本机或另一台机器上的 FastAPI 服务；跨机时改成 http://<后端IP>:8765
rag_api_base: "http://127.0.0.1:8765"
rag_area_id: "lingshan"        # 灵山胜境；拈花湾为 nianhuawan
rag_timeout_sec: 15.0          # 单次问答读超时（秒）
rag_session_id: ""             # 空 = 启动时生成，运行期复用（多轮上下文在后端）

# ---------- 会话 / 状态机 ----------
auto_resume_silence_sec: 0.5   # 静默多久自动续播讲解
resume_check_period: 0.2       # 续播检查周期
idle_timeout_sec: 10.0         # ACTIVE 静默超时回 IDLE
only_resume_when_idle: true    # 仅 IDLE 时自动续播

# ---------- 提示语 ----------
wakeup_prompt: "您好，我在。"
back_to_idle_prompt: "如果您有任何问题，请呼唤两声小娟唤醒我哦。"

# ---------- ASR 文本过滤（出现即丢弃） ----------
asr_filter_words: ["志愿者", "杨茜茜", "字幕", "转发", "明镜", "观看", "感谢观看", "谢谢", "搅拌"]
