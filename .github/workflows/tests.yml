name: tests

# 语音前端单测：tests/conftest.py 会把 torch/funasr/sounddevice 等重型依赖
# 用空模块占位，所以 CI 只需 pytest + pyyaml + requests + numpy 即可跑全量用例。
on:
  push:
    branches: [lmam]
  pull_request:
    branches: [lmam]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10" pyyaml requests numpy

      - name: 运行单测
        run: python -m pytest tests -q
